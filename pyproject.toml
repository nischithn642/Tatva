[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tatva-compiler"
dynamic = ["version"]
description = "TATVA: AI Model Compiler and Optimization Toolchain for RISC-V Processors"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "TATVA Authors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "numpy>=1.24.0,<3.0.0",
    "onnx>=1.14.0,<2.0.0",
    "onnxruntime>=1.15.0,<2.0.0",
    # apache-tvm ships a prebuilt runtime DLL linked against one exact tvm-ffi ABI.
    # An unpinned tvm-ffi resolves to a newer release and `import tvm` then dies with
    # "WinError 127: the specified procedure could not be found". Keep both bounded.
    "apache-tvm>=0.25.0,<0.26.0",
    "apache-tvm-ffi>=0.1.12,<0.1.13",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gui = [
    "pywebview>=6.0.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[project.scripts]
tatva = "tatva.cli:cli"

[tool.hatch.version]
path = "src/tatva/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/dist",
  "/build",
  "/qemu",
  "/riscv-toolchain",
  "/_backup",
  "/.git",
  "/scratch",
  "__pycache__",
  "*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tatva", "src/scaffolding"]

[tool.hatch.build.targets.wheel.force-include]
"website" = "tatva/website"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_backup", ".venv", "build", "dist", "scratch", "website"]
markers = [
    "unit: Fast, toolchain-independent unit tests",
    "integration: Full compiler pipeline tests requiring toolchain & QEMU",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "_backup", "scratch", "build", "dist", "website"]

[tool.ruff.lint]
# Pin the rule set explicitly. With no `select`, `ruff check` uses whatever that
# version of ruff defaults to -- which changed under us and turned a clean tree into
# 262 findings without a line of code being touched. CI should fail because the code
# changed, not because the linter did.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: real bug patterns
    "UP",   # pyupgrade: modern syntax for the Python we actually require
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own checks
]
ignore = [
    # Broad `except Exception` is deliberate throughout: the CLI, the GUI workers and
    # the diagnostics path all exist to degrade gracefully rather than traceback at a
    # user. Where it matters the handler reports the exception rather than swallowing it.
    "BLE001",
    "E501",  # line length is enforced by the formatter, not by failing the build
]
